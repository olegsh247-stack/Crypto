name: Seed observation idempotency rehearsal

on:
  pull_request:
    paths:
      - "infrastructure/neon/seed-v1.sql"
      - "infrastructure/neon/schema-v1.sql"
      - "infrastructure/neon/migrations/**"
      - "scripts/migrate-neon.sh"
      - "scripts/test-seed-observation-idempotency.sh"
      - ".github/workflows/seed-observation-idempotency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start disposable PostgreSQL 16
        run: |
          set -euo pipefail
          docker run -d --name crypto-seed-idempotency \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=crypto_test \
            -p 55432:5432 postgres:16
          trap 'docker rm -f crypto-seed-idempotency >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 55432 -U postgres -d crypto_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs crypto-seed-idempotency
          exit 1

      - name: Apply schema and migrations to disposable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/crypto_test
        run: |
          set -euo pipefail
          chmod +x scripts/migrate-neon.sh
          ./scripts/migrate-neon.sh

      - name: Verify seed rerun and revision behavior
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/crypto_test
        run: |
          set -euo pipefail
          chmod +x scripts/test-seed-observation-idempotency.sh
          ./scripts/test-seed-observation-idempotency.sh
