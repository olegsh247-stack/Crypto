name: VPS Docker image build

on:
  pull_request:
    paths:
      - "vps/**"
      - "web/**"
      - "shared/**"
      - ".github/workflows/vps-docker-image-build.yml"
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "web/**"
      - "shared/**"
      - ".github/workflows/vps-docker-image-build.yml"

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      ADMIN_TOKEN: ci-only-admin-token
      CORS_ORIGIN: http://localhost:3000
      CADDY_DOMAIN: localhost
      BACKUP_DIR_HOST: /tmp/crypto-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate the Web dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix web
      - name: Upload generated Web dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
      - name: Validate Compose configuration
        run: docker compose -f vps/docker-compose.production.yml config --quiet
      - name: Build Web, API and Worker images
        run: docker compose -f vps/docker-compose.production.yml build api worker web
