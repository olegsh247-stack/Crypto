name: Temporary Web Dependency Audit
on:
  push:
    branches:
      - fix/admin-session-csrf-hardening
    paths:
      - '.github/workflows/temporary-web-dependency-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || audit_status=$?
          echo "npm audit exit code: ${audit_status:-0}"
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable, effects:v.effects}))},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: web-npm-audit-report
          path: web/npm-audit.json
          if-no-files-found: error
