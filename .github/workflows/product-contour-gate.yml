name: Product Contour Gate

on:
  pull_request:
    paths:
      - "web/**"
      - "workers/**"
      - "shared/**"
      - "research/**"
      - "infrastructure/neon/**"
      - "scripts/**"
      - "docs/PRODUCT-CONTOUR-V1*"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-contour-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Build + read-only UI/API contract
    uses: ./.github/workflows/ui-runtime-e2e.yml

  migration-rehearsal:
    name: Disposable DB migration rehearsal
    uses: ./.github/workflows/migration-rehearsal.yml
