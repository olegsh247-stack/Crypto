name: Web UI and E2E

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "scripts/e2e-smoke.mjs"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        env:
          CRYPTO_API_URL: ${{ secrets.CRYPTO_API_URL }}
          CRYPTO_ADMIN_TOKEN: ${{ secrets.CRYPTO_ADMIN_TOKEN }}
        run: npm run build

  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run live Crypto API E2E
        env:
          CRYPTO_API_URL: ${{ secrets.CRYPTO_API_URL }}
        run: node scripts/e2e-smoke.mjs
