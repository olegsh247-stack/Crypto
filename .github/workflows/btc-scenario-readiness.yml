name: BTC Scenario Readiness Gate

on:
  pull_request:
    paths:
      - "scripts/btc-scenario-readiness.mjs"
      - "scripts/btc-scenario-readiness.test.mjs"
      - "scripts/btc-scenario-direction.mjs"
      - "scripts/btc-scenario-direction.test.mjs"
      - ".github/workflows/btc-scenario-readiness.yml"
      - "docs/BTC-SCENARIO-V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical shared readiness implementation
        working-directory: vps/shared
        run: npm install && npm run build
      - name: Test scenario input-quality and directional rules
        run: node --test scripts/btc-scenario-readiness.test.mjs scripts/btc-scenario-direction.test.mjs
