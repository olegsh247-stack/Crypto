name: VPS API Build Rehearsal

on:
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "shared/**"
      - "infrastructure/neon/**"
      - "scripts/migrate-neon.sh"
      - "scripts/vps-api-parity.mjs"
      - ".github/workflows/vps-api-build.yml"
  pull_request:
    paths:
      - "vps/**"
      - "shared/**"
      - "infrastructure/neon/**"
      - "scripts/migrate-neon.sh"
      - "scripts/vps-api-parity.mjs"
      - ".github/workflows/vps-api-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build VPS shared runtime
        working-directory: vps/shared
        run: npm install && npm run build
      - name: Install VPS API dependencies
        working-directory: vps/api
        run: npm install
      - name: Build VPS worker
        working-directory: vps/worker
        run: npm install && npm run build
      - name: Build VPS API
        working-directory: vps/api
        run: npm run build
      - name: Start PostgreSQL rehearsal
        run: |
          image=public.ecr.aws/docker/library/postgres:16
          for attempt in 1 2 3 4; do
            if docker pull "$image"; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          docker run -d --name crypto-vps-postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=crypto_test -p 55432:5432 "$image"
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 55432 -U postgres -d crypto_test >/dev/null 2>&1 && break
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 55432 -U postgres -d crypto_test
      - name: Bootstrap PostgreSQL with repository migrations
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:55432/crypto_test'
          chmod +x scripts/migrate-neon.sh
          ./scripts/migrate-neon.sh
          ./scripts/migrate-neon.sh
          count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from schema_migrations;")
          duplicates=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from (select version from schema_migrations group by version having count(*) > 1) d;")
          test "$count" -gt 0
          test "$duplicates" = "0"
          echo "VPS_DB_BOOTSTRAP_OK migrations=$count duplicate_markers=0 rerun=1"
      - name: Scenario-state transaction rollback rehearsal (disposable PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/crypto_test
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=scripts/scenario-state-rollback-rehearsal.sql

      - name: Start VPS API
        working-directory: vps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/crypto_test
          ADMIN_TOKEN: local-development-only
          CORS_ORIGIN: http://localhost:3000
          PORT: 8080
          HOST: 127.0.0.1
        run: |
          nohup node dist/server.js > /tmp/crypto-vps-api.log 2>&1 &
          echo $! > /tmp/crypto-vps-api.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health | tee /tmp/health.json
          curl -fsS http://127.0.0.1:8080/api/db-health | tee /tmp/db-health.json
      - name: VPS API contract E2E
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/assets > /tmp/assets.json
          curl -fsS http://127.0.0.1:8080/api/pairs > /tmp/pairs.json
          python3 - <<'PY'
          import json
          assets=json.load(open('/tmp/assets.json'))
          pairs=json.load(open('/tmp/pairs.json'))
          items=assets.get('assets',assets.get('items',assets if isinstance(assets,list) else []))
          pitems=pairs.get('items',pairs.get('pairs',[]))
          assert len(items)==10, f"assets={len(items)}"
          expected_assets={"btc","dash","eth","sol","cake","bch","ltc","xrp","trx","usdt"}
          actual_assets={item.get("asset_id") for item in items}
          assert actual_assets==expected_assets, f"asset_ids={sorted(str(x) for x in actual_assets)}"
          assert len(pitems)==9, f"pairs={len(pitems)}"
          assert all(p.get('enabled') is True for p in pitems)
          print(f"VPS_API_REGISTRY_OK assets={len(items)} pairs={len(pitems)}")
          PY
          curl -fsS http://127.0.0.1:8080/api/assets/eth > /tmp/eth.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/eth.json'))
          asset=d.get('asset',d)
          assert asset.get('asset_id')=='eth', asset
          assert asset.get('research_status') in ('current','outdated','in_progress','complete','monitoring','not_started'), asset
          assert asset.get('research_freshness',{}).get('status') in ('current','update_recommended','outdated'), asset
          print("VPS_API_ETH_OK lifecycle=1 freshness=1")
          PY
          # Public observation reads are scoped to an enabled asset and bounded to 100 rows.
          curl -fsS 'http://127.0.0.1:8080/api/observations?asset_id=eth&limit=10' > /tmp/eth-observations.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/eth-observations.json'))
          assert d.get('status')=='ok', d
          assert d.get('read_only') is True, d
          assert d.get('asset_id')=='eth', d
          assert d.get('limit')==10, d
          assert isinstance(d.get('items'),list), d
          assert d.get('count')==len(d['items']), d
          for item in d['items']:
            assert item.get('asset_id')=='eth', item
            assert item.get('observation_id') and item.get('metric_id') and item.get('source_id'), item
            assert item.get('observed_at') and item.get('revision',0)>=1, item
          print(f"VPS_API_OBSERVATIONS_OK read_only=1 rows={len(d['items'])}")
          PY
          missing_asset_code=$(curl -sS -o /tmp/observations-missing-asset.json -w '%{http_code}' 'http://127.0.0.1:8080/api/observations')
          test "$missing_asset_code" = "400"
          invalid_limit_code=$(curl -sS -o /tmp/observations-invalid-limit.json -w '%{http_code}' 'http://127.0.0.1:8080/api/observations?asset_id=eth&limit=abc')
          test "$invalid_limit_code" = "400"
          oversized_limit_code=$(curl -sS -o /tmp/observations-oversized-limit.json -w '%{http_code}' 'http://127.0.0.1:8080/api/observations?asset_id=eth&limit=101')
          test "$oversized_limit_code" = "400"
          unknown_asset_code=$(curl -sS -o /tmp/observations-unknown-asset.json -w '%{http_code}' 'http://127.0.0.1:8080/api/observations?asset_id=does-not-exist')
          test "$unknown_asset_code" = "404"
          echo "VPS_API_OBSERVATIONS_VALIDATION_OK missing_asset=400 invalid_limit=400 oversized_limit=400 unknown_asset=404"
      - name: VPS admin observation ingestion E2E (disposable PostgreSQL)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          artifact = {
            "schema_version": "1.0",
            "artifact_type": "read_only_eth_observation_capture",
            "database_write_performed": False,
            "blockchain_write_performed": False,
            "metrics": [{
              "metric_id": "eth.market_spot_price",
              "asset_id": "ETH",
              "value_numeric": 2500.25,
              "unit": "USDT/ETH",
              "observed_at": "2026-10-10T07:00:00Z",
              "time_semantics": "capture_time_proxy; Binance ticker response has no observation timestamp",
              "period_start": None,
              "period_end": None,
              "source_id": "market_binance",
              "source_url": "https://data-api.binance.vision/api/v3/ticker/price?symbol=ETHUSDT",
              "methodology": "Disposable contract fixture; numeric value is test data, not a market claim.",
              "quality": "usable_for_rehearsal_only"
            }]
          }
          with open("/tmp/eth-observation-artifact.json", "w") as f:
            json.dump(artifact, f)
          artifact["database_write_performed"] = True
          with open("/tmp/eth-observation-invalid-artifact.json", "w") as f:
            json.dump(artifact, f)
          PY
          auth=(-H 'Authorization: Bearer local-development-only' -H 'Content-Type: application/json')
          unauth_code=$(curl -sS -o /tmp/observation-unauth.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/admin/observations --data-binary @/tmp/eth-observation-artifact.json)
          test "$unauth_code" = "401"
          invalid_code=$(curl -sS -o /tmp/observation-invalid.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/admin/observations --data-binary @/tmp/eth-observation-invalid-artifact.json)
          test "$invalid_code" = "400"
          first_code=$(curl -sS -o /tmp/observation-ingest-first.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/admin/observations --data-binary @/tmp/eth-observation-artifact.json)
          test "$first_code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/observation-ingest-first.json'))
          assert d.get('status')=='ok', d
          assert d.get('read_only') is False, d
          assert d.get('received_count')==1 and d.get('inserted_count')==1 and d.get('duplicate_count')==0, d
          assert len(d.get('items',[]))==1 and d['items'][0].get('metric_id')=='eth.market_spot_price', d
          print("VPS_API_OBSERVATION_INGEST_OK inserted=1")
          PY
          replay_code=$(curl -sS -o /tmp/observation-ingest-replay.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/admin/observations --data-binary @/tmp/eth-observation-artifact.json)
          test "$replay_code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/observation-ingest-replay.json'))
          assert d.get('status')=='ok', d
          assert d.get('received_count')==1 and d.get('inserted_count')==0 and d.get('duplicate_count')==1, d
          print("VPS_API_OBSERVATION_IDEMPOTENCY_OK replay_inserted=0 duplicate=1")
          PY
          stored=$(psql 'postgresql://postgres:postgres@127.0.0.1:55432/crypto_test' --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from observations where metric_id='eth.market_spot_price' and asset_id='eth' and source_id='market_binance' and observed_at='2026-10-10T07:00:00Z'::timestamptz and revision=1;")
          test "$stored" = "1"
          echo "VPS_API_OBSERVATION_STORAGE_OK unique_natural_key_rows=$stored"
      - name: VPS mutation contract E2E
        run: |
          set -euo pipefail
          auth=(-H 'Authorization: Bearer local-development-only' -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/asset-mutation.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/assets -d '{"symbol":"VPSQA","name":"VPS QA Asset","enabled":false}')
          test "$code" = "201"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/asset-mutation.json'))
          assert d.get('status')=='ok'
          assert d['item']['asset_id']=='vpsqa'
          PY
          asset_id=vpsqa
          code=$(curl -sS -o /tmp/asset-delete.json -w '%{http_code}' "${auth[@]}" -X DELETE "http://127.0.0.1:8080/api/assets/$asset_id")
          test "$code" = "200"
          code=$(curl -sS -o /tmp/pair-mutation.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/pairs -d '{"symbol":"BTC/USDT","exchange":"binance"}')
          test "$code" = "201"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pair-mutation.json'))
          assert d.get('status')=='ok'
          assert d['item']['symbol']=='BTC/USDT'
          assert d['item']['exchange']=='binance'
          assert d['item']['enabled'] is True
          PY
          code=$(curl -sS -o /tmp/commodity-mutation.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/commodities -d '{"symbol":"VPSQA","name":"VPS QA Commodity","unit":"unit"}')
          test "$code" = "201"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/commodity-mutation.json'))
          assert d.get('status')=='ok'
          assert d['item']['symbol']=='VPSQA'
          PY
          commodity_id=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/commodity-mutation.json'))['item']['id'])
          PY
          )
          code=$(curl -sS -o /tmp/commodity-delete.json -w '%{http_code}' "${auth[@]}" -X DELETE "http://127.0.0.1:8080/api/commodities/$commodity_id")
          test "$code" = "200"
          echo "VPS_API_MUTATIONS_OK asset_create_delete=1 pair_upsert=1 commodity_create_delete=1"
      - name: VPS worker ingestion E2E
        working-directory: vps/worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/crypto_test
          WORKER_INTERVAL_MS: "0"
        run: |
          set -euo pipefail
          before=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles;")
          monitoring_before=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select coalesce(max(last_updated_at), 'epoch'::timestamptz) from monitoring_signals where status <> 'disabled';")
          timeout 180s node dist/index.js | tee /tmp/crypto-vps-worker-1.log
          after=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles;")
          result=$(grep -Eo '\{"status":"ok","service":"crypto-worker-vps"[^}]*\}' /tmp/crypto-vps-worker-1.log | tail -1)
          test -n "$result"
          successful=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["successful"])' "$result")
          written=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["written"])' "$result")
          test "$successful" = "9"
          test "$written" -gt 0
          test "$after" -gt "$before"
          history_code=$(curl -sS --max-time 15 -o /tmp/history.json -w '%{http_code}' 'http://127.0.0.1:8080/api/pairs/ETH%2FUSDT/history?days=30&interval=1d' || true)
          if [ "$history_code" != "200" ]; then
            echo "VPS_API_HISTORY_FAILED status=$history_code"
            cat /tmp/history.json 2>/dev/null || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/history.json'))
          assert d.get('status')=='ok', d
          assert len(d.get('rows',[]))>0, d
          print(f"VPS_API_HISTORY_OK rows={len(d['rows'])}")
          PY
          actual_assets=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select string_agg(asset_id,' ' order by asset_id) from assets where enabled=true and asset_id <> 'usdt';" | xargs)
          test "$actual_assets" = "bch btc cake dash eth ltc sol trx xrp"
          for asset in btc dash eth sol cake bch ltc xrp trx; do
            total=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles where asset_id='$asset';" | tr -d '[:space:]')
            fresh=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles where asset_id='$asset' and candle_open_at >= current_date - interval '2 days';" | tr -d '[:space:]')
            echo "VPS_WORKER_ASSET asset=$asset total=$total fresh_2d=$fresh"
            test "$fresh" -ge 1
          done
          timeout 180s node dist/index.js | tee /tmp/crypto-vps-worker-2.log
          duplicates=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from (select asset_id,candle_open_at from market_daily_candles group by asset_id,candle_open_at having count(*) > 1) d;")
          test "$duplicates" = "0"
          monitoring_after=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select coalesce(max(last_updated_at), 'epoch'::timestamptz) from monitoring_signals where status <> 'disabled';")
          monitoring_count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from monitoring_signals where status <> 'disabled';")
          if [ "$monitoring_count" -gt 0 ]; then
            test "$monitoring_after" = "$monitoring_before"
            monitoring_signal_timestamp_unchanged=1
          else
            monitoring_signal_timestamp_unchanged=1
          fi
          echo "VPS_WORKER_E2E_OK successful=$successful written=$written assets=9 exact_registry=1 fresh_2d=1 runs=2 duplicate_keys=$duplicates monitoring_signal_timestamp_unchanged=$monitoring_signal_timestamp_unchanged"
      - name: VPS API parity against live Worker
        env:
          LIVE_API_URL: https://crypto-api.olegsh247.workers.dev
          VPS_API_URL: http://127.0.0.1:8080
        run: node scripts/vps-api-parity.mjs

      - name: ETH scenario snapshot preflight (read-only)
        env:
          LIVE_API_URL: https://crypto-api.olegsh247.workers.dev
          VPS_API_URL: http://127.0.0.1:8080
        run: node scripts/eth-scenario-preflight.mjs

      - name: VPS admin boundary E2E
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' http://127.0.0.1:8080/api/admin/db-schema)
          test "$code" = "401"
          code=$(curl -sS -o /tmp/admin-ok.json -w '%{http_code}' -H 'Authorization: Bearer local-development-only' http://127.0.0.1:8080/api/admin/db-schema)
          test "$code" = "200"
          echo "VPS_API_ADMIN_OK unauthorized=401 authorized=200"
      - name: Cleanup PostgreSQL rehearsal
        if: always()
        run: docker rm -f crypto-vps-postgres >/dev/null 2>&1 || true
