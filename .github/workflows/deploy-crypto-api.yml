name: Deploy Crypto API

on:
  push:
    branches:
      - main
    paths:
      - "workers/crypto-api/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-crypto-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Worker dependencies
        working-directory: workers/crypto-api
        run: npm install --no-audit --no-fund

      - name: Configure database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$NEON_DATABASE_URL"
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --name crypto-api

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: deploy

      - name: Verify health and live database schema
        run: |
          set -euo pipefail
          base="https://crypto-api.olegsh247.workers.dev"
          health="$(curl -fsS --retry 5 --retry-delay 2 "$base/api/db-health")"
          echo "HEALTH: $health"
          schema="$(curl -fsS --retry 5 --retry-delay 2 "$base/api/admin/db-schema")"
          echo "$schema" | python -m json.tool
          echo "$schema" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("read_only") is True and isinstance(d.get("tables"),list); print(f"SCHEMA_OK tables={len(d[\"tables\"])} columns={len(d.get(\"columns\",[]))} constraints={len(d.get(\"constraints\",[]))} indexes={len(d.get(\"indexes\",[]))}")'
