name: CAKE Transfer Log Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cake-transfer-log-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture CAKE dead-address Transfer logs (read-only)
        env:
          BSC_RPC_URL: https://bsc-rpc.publicnode.com
          BSC_RPC_FALLBACK_URL: https://rpc-bnb.blockmachine.io
          RPC_MIN_INTERVAL_SECONDS: "1.05"
        run: |
          python scripts/research/capture_cake_transfer_logs.py --chunk-size 10000 --output cake-transfer-log-reconciliation.json
      - name: Upload raw reconciliation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cake-transfer-log-reconciliation
          path: cake-transfer-log-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
