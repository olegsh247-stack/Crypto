name: BTC Block Window Validation
on:
  pull_request:
    paths:
      - "scripts/capture-btc-block-window.mjs"
      - "scripts/btc-block-window-validation.mjs"
      - "scripts/btc-block-window-validation.test.mjs"
      - ".github/workflows/btc-block-window-validation.yml"
  push:
    branches:
      - "btc-block-window-hardening-2026-10-13"
    paths:
      - "scripts/capture-btc-block-window.mjs"
      - "scripts/btc-block-window-validation.mjs"
      - "scripts/btc-block-window-validation.test.mjs"
      - ".github/workflows/btc-block-window-validation.yml"
  workflow_dispatch:
    inputs:
      run_live_capture:
        description: "Run a read-only capture from public Mempool.space endpoints and retain evidence as an artifact"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check read-only capture
        run: node --check scripts/capture-btc-block-window.mjs
      - name: Run deterministic tests
        run: node --test scripts/btc-block-window-validation.test.mjs
      - name: Run read-only live BTC block-window capture
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_live_capture) }}
        run: node scripts/capture-btc-block-window.mjs
      - name: Run read-only BTC public-source capture
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: node scripts/capture-btc-public-sources.mjs
      - name: Upload public-source review evidence
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: btc-public-source-review-${{ github.run_id }}
          path: tmp/btc-source-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload live capture evidence
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_live_capture)) }}
        uses: actions/upload-artifact@v4
        with:
          name: btc-block-window-review-${{ github.run_id }}
          path: tmp/btc-block-window-review/
          if-no-files-found: warn
          retention-days: 14
