services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - crypto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  migrate:
    image: postgres:16
    profiles: ["ops"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/crypto
    volumes:
      - ../infrastructure:/repo/infrastructure:ro
      - ../scripts/migrate-postgres.sh:/repo/scripts/migrate-postgres.sh:ro
    working_dir: /repo
    command: ["bash", "scripts/migrate-postgres.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  backup:
    image: postgres:16
    profiles: ["ops"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/crypto
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../scripts/backup-postgres.sh:/repo/scripts/backup-postgres.sh:ro
      - ${BACKUP_DIR_HOST:?Set BACKUP_DIR_HOST in .env.production}:/backups
    working_dir: /repo
    command: ["bash", "scripts/backup-postgres.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/crypto
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      PORT: "8080"
      HOST: 0.0.0.0
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      CRYPTO_API_URL: http://api:8080
      CRYPTO_ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env.production}
      CRYPTO_ADMIN_LOGIN_SECRET: ${CRYPTO_ADMIN_LOGIN_SECRET:?Set CRYPTO_ADMIN_LOGIN_SECRET in .env.production}
      CRYPTO_ADMIN_SESSION_SECRET: ${CRYPTO_ADMIN_SESSION_SECRET:?Set CRYPTO_ADMIN_SESSION_SECRET in .env.production}
      CRYPTO_ADMIN_ORIGIN: ${CRYPTO_ADMIN_ORIGIN:?Set CRYPTO_ADMIN_ORIGIN in .env.production}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - edge

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/crypto
      WORKER_SCHEDULE_UTC: ${WORKER_SCHEDULE_UTC:-00:30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge

volumes:
  crypto-postgres-data:
  caddy-data:
  caddy-config:
