name: Apply Neon Research Engine v2

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/neon/schema-v1.sql'
      - 'infrastructure/neon/migrations/**.sql'
      - 'scripts/migrate-neon.sh'
      - '.github/workflows/apply-neon-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check database secret
        run: test -n "$DATABASE_URL"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema and versioned migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          chmod +x scripts/migrate-neon.sh
          ./scripts/migrate-neon.sh

      - name: Verify required Engine tables
        run: |
          count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('asset_types','research_domains','research_blocks','research_block_domains','evidence','critical_factors','research_scores','research_scenarios','monitoring_signals','research_status','market_pairs','commodities');")
          echo "Engine tables: $count / 12"
          test "$count" = "12"

      - name: Verify market_pairs contract
        run: |
          count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='market_pairs' AND column_name IN ('symbol','base_asset_id','quote_asset_id','exchange','enabled');")
          echo "market_pairs columns: $count / 5"
          test "$count" = "5"

      - name: Verify market pair integrity
        run: |
          orphan_base=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM market_pairs mp LEFT JOIN assets a ON a.asset_id=mp.base_asset_id WHERE a.asset_id IS NULL;")
          orphan_quote=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM market_pairs mp LEFT JOIN assets a ON a.asset_id=mp.quote_asset_id WHERE a.asset_id IS NULL;")
          invalid_symbol=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM market_pairs WHERE symbol <> upper(symbol) OR position('/' in symbol)=0;")
          identical_legs=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM market_pairs WHERE base_asset_id=quote_asset_id;")
          echo "Orphan base assets: $orphan_base / 0"
          echo "Orphan quote assets: $orphan_quote / 0"
          echo "Invalid pair symbols: $invalid_symbol / 0"
          echo "Identical pair legs: $identical_legs / 0"
          test "$orphan_base" = "0"
          test "$orphan_quote" = "0"
          test "$invalid_symbol" = "0"
          test "$identical_legs" = "0"

      - name: Verify canonical market pairs
        run: |
          usdt=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE asset_id='usdt' AND symbol='USDT' AND primary_asset_type_id='stablecoin' AND category='stablecoin' AND enabled;")
          pairs=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM (VALUES ('BTC/USDT','btc'),('DASH/USDT','dash'),('ETH/USDT','eth'),('SOL/USDT','sol'),('CAKE/USDT','cake'),('BCH/USDT','bch'),('LTC/USDT','ltc'),('XRP/USDT','xrp'),('TRX/USDT','trx')) expected(symbol,base_asset_id) WHERE NOT EXISTS (SELECT 1 FROM market_pairs mp WHERE mp.symbol=expected.symbol AND mp.base_asset_id=expected.base_asset_id AND mp.quote_asset_id='usdt' AND mp.exchange='binance' AND mp.enabled);")
          echo "USDT quote asset: $usdt / 1"
          echo "Missing canonical pairs: $pairs / 0"
          test "$usdt" = "1"
          test "$pairs" = "0"

      - name: Report non-canonical asset IDs
        run: |
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT asset_id FROM assets WHERE asset_id <> lower(asset_id) ORDER BY asset_id;"

      - name: Verify Asset Registry contract
        run: |
          invalid_ids=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE asset_id <> lower(asset_id);")
          missing_type=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE enabled AND primary_asset_type_id IS NULL;")
          invalid_tier=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE research_tier NOT IN ('A','B','C');")
          missing_category=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE enabled AND NULLIF(trim(category),'') IS NULL;")
          missing_name=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE enabled AND NULLIF(trim(name),'') IS NULL;")
          echo "Non-canonical asset IDs: $invalid_ids / 0"
          echo "Enabled assets without primary type: $missing_type / 0"
          echo "Invalid research tiers: $invalid_tier / 0"
          echo "Enabled assets without category: $missing_category / 0"
          echo "Enabled assets without name: $missing_name / 0"
          test "$invalid_ids" = "0"
          test "$missing_type" = "0"
          test "$invalid_tier" = "0"
          test "$missing_category" = "0"
          test "$missing_name" = "0"

      - name: Verify canonical market identities
        run: |
          invalid_market_identities=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM (VALUES ('btc','BTC','BTCUSDT'),('dash','DASH','DASHUSDT'),('eth','ETH','ETHUSDT'),('sol','SOL','SOLUSDT'),('cake','CAKE','CAKEUSDT'),('bch','BCH','BCHUSDT'),('ltc','LTC','LTCUSDT'),('xrp','XRP','XRPUSDT'),('trx','TRX','TRXUSDT')) expected(asset_id,symbol,binance_symbol) WHERE NOT EXISTS (SELECT 1 FROM assets a WHERE a.asset_id=expected.asset_id AND a.symbol=expected.symbol AND a.binance_symbol=expected.binance_symbol AND jsonb_typeof(a.fallback_symbols)='object' AND a.fallback_symbols <> '{}'::jsonb);")
          invalid_fallbacks=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE asset_id IN ('btc','dash','eth','sol','cake','bch','ltc','xrp','trx') AND (jsonb_typeof(fallback_symbols) <> 'object' OR fallback_symbols = '{}'::jsonb OR NOT (fallback_symbols ? 'okx') OR NOT (fallback_symbols ? 'bybit') OR NOT (fallback_symbols ? 'mexc'));")
          echo "Invalid canonical market identities: $invalid_market_identities / 0"
          echo "Invalid fallback mappings: $invalid_fallbacks / 0"
          test "$invalid_market_identities" = "0"
          test "$invalid_fallbacks" = "0"

      - name: Verify canonical asset type classifications
        run: |
          invalid_classifications=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM (VALUES ('btc','monetary_asset'),('dash','l1_settlement_asset'),('eth','l1_settlement_asset'),('sol','l1_execution_asset'),('cake','defi_protocol_token'),('bch','monetary_asset'),('ltc','monetary_asset'),('xrp','l1_settlement_asset'),('trx','l1_settlement_asset')) expected(asset_id,primary_asset_type_id) WHERE NOT EXISTS (SELECT 1 FROM assets a WHERE a.asset_id=expected.asset_id AND a.primary_asset_type_id=expected.primary_asset_type_id);")
          echo "Invalid canonical asset classifications: $invalid_classifications / 0"
          test "$invalid_classifications" = "0"

      - name: Verify canonical asset identities
        run: |
          eth=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE asset_id='eth' AND symbol='ETH' AND primary_asset_type_id='l1_settlement_asset' AND category='core' AND research_tier='A';")
          uppercase=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE asset_id='ETH';")
          echo "canonical eth: $eth / 1"
          echo "uppercase ETH rows: $uppercase / 0"
          test "$eth" = "1"
          test "$uppercase" = "0"

      - name: Verify ETH Asset Card
        run: |
          asset=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE asset_id='eth' AND primary_asset_type_id='l1_settlement_asset' AND category='core';")
          blocks=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_blocks WHERE snapshot_id='ETH-2026-10-04-v1' AND block_number BETWEEN 1 AND 15 AND status='complete';")
          domains=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_block_domains rb JOIN research_blocks b ON b.research_block_id=rb.research_block_id WHERE b.snapshot_id='ETH-2026-10-04-v1';")
          factors=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM critical_factors WHERE asset_id='eth' AND snapshot_id='ETH-2026-10-04-v1';")
          scenarios=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_scenarios WHERE snapshot_id='ETH-2026-10-04-v1';")
          scores=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_scores WHERE asset_id='eth' AND snapshot_id='ETH-2026-10-04-v1';")
          signals=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM monitoring_signals WHERE asset_id='eth';")
          freshness=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_status WHERE asset_id='eth' AND status='current';")
          lifecycle=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT CASE WHEN COUNT(*)=0 THEN 'not_started' WHEN bool_or(block_number=15 AND status='complete') THEN 'monitoring' WHEN COUNT(*)>=15 THEN 'complete' ELSE 'in_progress' END FROM research_blocks WHERE snapshot_id='ETH-2026-10-04-v1';")
          echo "ETH asset: $asset / 1"
          echo "ETH blocks: $blocks / 15"
          echo "ETH block-domain links: $domains / 15"
          echo "ETH critical factors: $factors / 6"
          echo "ETH scenarios: $scenarios / 3"
          echo "ETH scores: $scores / 5"
          echo "ETH monitoring signals: $signals / 6"
          echo "ETH freshness rows: $freshness / 1"
          echo "ETH lifecycle: $lifecycle / monitoring"
          test "$asset" = "1"
          test "$blocks" = "15"
          test "$domains" = "15"
          test "$factors" = "6"
          test "$scenarios" = "3"
          test "$scores" = "5"
          test "$signals" = "6"
          test "$freshness" = "1"
          test "$lifecycle" = "monitoring"

      - name: Verify ETH Asset Card contract integrity
        run: |
          missing_blocks=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM generate_series(1,15) n WHERE NOT EXISTS (SELECT 1 FROM research_blocks rb WHERE rb.snapshot_id='ETH-2026-10-04-v1' AND rb.block_number=n AND rb.status='complete');")
          duplicate_blocks=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM (SELECT block_number FROM research_blocks WHERE snapshot_id='ETH-2026-10-04-v1' GROUP BY block_number HAVING COUNT(*) <> 1) d;")
          domain_count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_domains;")
          incomplete_domain_blocks=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM generate_series(1,15) n WHERE NOT EXISTS (SELECT 1 FROM research_blocks rb JOIN research_block_domains rbd ON rbd.research_block_id=rb.research_block_id WHERE rb.snapshot_id='ETH-2026-10-04-v1' AND rb.block_number=n);")
          scenario_types=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM research_scenarios WHERE snapshot_id='ETH-2026-10-04-v1' AND scenario_type IN ('bull','base','bear');")
          distinct_scenario_types=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(DISTINCT scenario_type) FROM research_scenarios WHERE snapshot_id='ETH-2026-10-04-v1' AND scenario_type IN ('bull','base','bear');")
          score_types=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(DISTINCT score_type) FROM research_scores WHERE asset_id='eth' AND snapshot_id='ETH-2026-10-04-v1' AND score_type IN ('health','thesis','value_accrual','confidence','competitive_position');")
          signal_names=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(DISTINCT name) FROM monitoring_signals WHERE asset_id='eth';")
          echo "Missing complete blocks: $missing_blocks / 0"
          echo "Duplicate block numbers: $duplicate_blocks / 0"
          echo "Research domains: $domain_count / 6"
          echo "Blocks without domain mapping: $incomplete_domain_blocks / 0"
          echo "Scenario rows: $scenario_types / 3"
          echo "Distinct scenarios: $distinct_scenario_types / 3"
          echo "Score types: $score_types / 5"
          echo "Distinct monitoring signals: $signal_names / 6"
          test "$missing_blocks" = "0"
          test "$duplicate_blocks" = "0"
          test "$domain_count" = "6"
          test "$incomplete_domain_blocks" = "0"
          test "$scenario_types" = "3"
          test "$distinct_scenario_types" = "3"
          test "$score_types" = "5"
          test "$signal_names" = "6"

      - name: Verify migration markers
        run: |
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT version FROM schema_migrations WHERE version IN ('2026-09-24-research-engine-v2','2026-10-04-eth-asset-card','2026-10-05-eth-asset-card','2026-10-05-eth-asset-type','2026-10-05-monitoring-signal-uniqueness','2026-10-06-canonicalize-asset-identities','2026-10-07-market-pair-integrity','2026-10-08-canonical-usdt-market-pairs') ORDER BY version;" | grep -qx $'2026-09-24-research-engine-v2\n2026-10-04-eth-asset-card\n2026-10-05-eth-asset-card\n2026-10-05-eth-asset-type\n2026-10-05-monitoring-signal-uniqueness\n2026-10-06-canonicalize-asset-identities\n2026-10-07-market-pair-integrity\n2026-10-08-canonical-usdt-market-pairs'

      - name: Verify exchange-aware market pair identity
        run: |
          pair_unique=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM pg_constraint WHERE conrelid='market_pairs'::regclass AND conname='market_pairs_exchange_symbol_unique';")
          nullable_exchange=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM market_pairs WHERE exchange IS NULL OR btrim(exchange)='';")
          duplicate_pairs=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM (SELECT exchange,symbol FROM market_pairs GROUP BY exchange,symbol HAVING COUNT(*)>1) d;")
          echo "Exchange/symbol unique constraint: $pair_unique / 1"
          echo "Missing exchange: $nullable_exchange / 0"
          echo "Duplicate exchange/symbol pairs: $duplicate_pairs / 0"
          test "$pair_unique" = "1"
          test "$nullable_exchange" = "0"
          test "$duplicate_pairs" = "0"

      - name: Verify pair identity matches registry legs
        run: |
          mismatch=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM market_pairs mp JOIN assets ba ON ba.asset_id=mp.base_asset_id JOIN assets qa ON qa.asset_id=mp.quote_asset_id WHERE mp.symbol <> upper(ba.symbol || '/' || qa.symbol);")
          echo "Pair symbol/registry mismatches: $mismatch / 0"
          test "$mismatch" = "0"

      - name: Verify dynamic Asset Registry contract
        run: |
          enabled_missing_type=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets WHERE enabled AND primary_asset_type_id IS NULL;")
          enabled_invalid_type=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT COUNT(*) FROM assets a LEFT JOIN asset_types t ON t.asset_type_id=a.primary_asset_type_id WHERE a.enabled AND t.asset_type_id IS NULL;")
          echo "Enabled assets without type: $enabled_missing_type / 0"
          echo "Enabled assets with invalid type: $enabled_invalid_type / 0"
          test "$enabled_missing_type" = "0"
          test "$enabled_invalid_type" = "0"

      - name: Verify migration runner marker
        run: |
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT version FROM schema_migrations WHERE version='2026-10-09-market-pair-identity';" | grep -qx '2026-10-09-market-pair-identity'
