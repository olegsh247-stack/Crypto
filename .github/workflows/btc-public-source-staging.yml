name: BTC Public Source Staging (Read Only)

# Manual runs and watched-file pushes run the same bounded review-only capture; no database or scenario-state writes occur.
# A workflow-file-only change can refresh the capture when manual dispatch is unavailable.
# Read-only recapture requested 2026-10-27: refresh BTC spot/ETF evidence and re-evaluate freshness.
# Readiness review policy: fresh capture may use registered fallback sources; this workflow never writes production state.
on:
  push:
    paths:
      - "scripts/capture-btc-public-sources.mjs"
      - "scripts/prepare-btc-observation-candidates.mjs"
      - "scripts/prepare-btc-observation-candidates.test.mjs"
      - "scripts/evaluate-btc-review-capture.mjs"
      - "scripts/calculate-btc-review-scenario.mjs"
      - "scripts/calculate-btc-review-scenario.test.mjs"
      - "scripts/compare-btc-review-scenarios.mjs"
      - "scripts/compare-btc-review-scenarios.test.mjs"
      - "scripts/btc-scenario-readiness.mjs"
      - "vps/shared/src/btc-scenario-readiness.ts"
      - "data/CryptoDataModel/registry/metric-registry.json"
      - "scripts/parse-farside-etf-table.mjs"
      - "scripts/parse-farside-etf-table.test.mjs"
      - "scripts/compare-btc-etf-snapshots.mjs"
      - "scripts/compare-btc-etf-snapshots.test.mjs"
      - "scripts/validate-us-etf-session-calendar.mjs"
      - "scripts/assess-btc-etf-session-freshness.mjs"
      - "scripts/assess-btc-etf-session-freshness.test.mjs"
      - "data/CryptoDataModel/calendars/us-etf-equity-session-calendar-2026-2028.json"
      - "scripts/btc-protocol-supply.mjs"
      - "scripts/btc-protocol-supply.test.mjs"
      - "scripts/validate-btc-fee-window.mjs"
      - "scripts/validate-btc-fee-window.test.mjs"
      - "scripts/capture-btc-fee-subsidy-window.mjs"
      - "scripts/compare-btc-fee-windows.mjs"
      - "scripts/compare-btc-fee-windows.test.mjs"
      - ".github/workflows/btc-public-source-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping public-source captures and ambiguous artifact ownership.
concurrency:
  group: btc-public-source-staging
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shared BTC readiness contract
        run: npm install && npm run build
        working-directory: vps/shared
      - name: Test BTC confirmed-window reorg comparison
        run: node --test scripts/compare-btc-fee-windows.test.mjs
      - name: Test BTC per-block fee window validation
        run: node --test scripts/validate-btc-fee-window.test.mjs
      - name: Test Farside ETF table parsing and placeholder handling
        run: node --test scripts/parse-farside-etf-table.test.mjs
      - name: Test Bitcoin protocol-issued supply calculation
        run: node --test scripts/btc-protocol-supply.test.mjs
      - name: Test Farside two-snapshot revision comparison
        run: node --test scripts/compare-btc-etf-snapshots.test.mjs
      - name: Validate versioned US ETF session calendar baseline
        run: node scripts/validate-us-etf-session-calendar.mjs
      - name: Test session-aware ETF freshness contract (publication timing remains fail-closed)
        run: node --test scripts/assess-btc-etf-session-freshness.test.mjs
      - name: Test BTC observation candidate normalization
        run: node --test scripts/prepare-btc-observation-candidates.test.mjs
      - name: Capture public source responses for review only
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
        run: node scripts/capture-btc-public-sources.mjs
      - name: Capture and audit per-block BTC fee/subsidy window (review only)
        run: node scripts/capture-btc-fee-subsidy-window.mjs
      - name: Prepare normalized observation candidates (review only)
        run: node scripts/prepare-btc-observation-candidates.mjs
      - name: Test reproducible current BTC rule calculation
        run: node --test scripts/calculate-btc-review-scenario.test.mjs
      - name: Calculate current BTC scenario from this capture (review only)
        run: node scripts/calculate-btc-review-scenario.mjs
      - name: Test multi-capture stability comparison
        run: node --test scripts/compare-btc-review-scenarios.test.mjs
      - name: Verify identical capture inputs produce byte-identical reports
        run: |
          node scripts/calculate-btc-review-scenario.mjs tmp/btc-source-review/manifest.json tmp/btc-source-review/observation-candidates.json tmp/btc-source-review/btc-current-scenario-review-repeat.json
          cmp tmp/btc-source-review/btc-current-scenario-review.json tmp/btc-source-review/btc-current-scenario-review-repeat.json
      - name: Assess readiness from this capture (offline review only)
        run: node scripts/evaluate-btc-review-capture.mjs
      - name: Upload raw responses, provenance manifest, and review-only candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-public-source-review
          path: tmp/btc-source-review/
          if-no-files-found: error
          retention-days: 7
