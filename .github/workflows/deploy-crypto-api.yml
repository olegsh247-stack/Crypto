name: Deploy Crypto API

on:
  push:
    branches:
      - main
    paths:
      - "workers/crypto-api/**"
      - "shared/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-crypto-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Worker dependencies
        working-directory: workers/crypto-api
        run: npm install --no-audit --no-fund

      - name: Configure database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$NEON_DATABASE_URL"
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --name crypto-api

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: deploy

      - name: Verify health and live database schema
        run: |
          set -euo pipefail
          base="https://crypto-api.oleg247.workers.dev"
          health="$(curl -fsS --retry 5 --retry-delay 2 "$base/api/db-health")"
          echo "HEALTH: $health"
          schema="$(curl -fsS --retry 5 --retry-delay 2 "$base/api/admin/db-schema")"
          echo "$schema" | python -m json.tool
          SCHEMA_JSON="$schema" python - <<'PY'
          import json, os
          d = json.loads(os.environ["SCHEMA_JSON"])
          assert d.get("status") == "ok"
          assert d.get("read_only") is True
          assert isinstance(d.get("tables"), list)
          required = {"assets", "asset_types", "research_snapshots", "research_blocks", "research_domains", "research_block_domains", "critical_factors", "research_scores", "scenario_states", "monitoring_signals", "research_status", "market_pairs"}
          actual = {row["table_name"] for row in d["tables"]}
          missing = sorted(required - actual)
          assert not missing, f"MISSING_REQUIRED_ENGINE_TABLES: {missing}"
          print(f"ENGINE_CONTRACT_OK required_engine_tables={len(required)} total_tables={len(actual)} columns={len(d.get('columns', []))} constraints={len(d.get('constraints', []))} indexes={len(d.get('indexes', []))}")
          PY
