name: ETH Consensus Source Feasibility Probe (research)

on:
  pull_request:
    paths:
      - "scripts/research/probe_beacon_consensus_source.py"
      - "scripts/research/capture_eth_observations.py"
      - ".github/workflows/eth-consensus-source-probe.yml"
      - "docs/ETH-METRIC-SOURCE-CONTRACTS-2026-10-10.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eth-consensus-source-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Read-only historical Beacon API feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/research/capture_eth_observations.py scripts/research/probe_beacon_consensus_source.py
      - name: Capture candidate intervals (read-only)
        run: |
          mkdir -p research-consensus-probe
          python scripts/research/capture_eth_observations.py --output research-consensus-probe/eth-observation-capture.json
      - name: Probe historical finalized epochs (read-only)
        run: |
          BEACON_API_BASE_URL=https://ethereum-beacon-api.publicnode.com BEACON_API_PROVIDER="PublicNode Beacon API" python scripts/research/probe_beacon_consensus_source.py --artifact research-consensus-probe/eth-observation-capture.json --output research-consensus-probe/eth-consensus-source-publicnode.json
          BEACON_API_BASE_URL=https://public-mainnet-node.ethereum.org BEACON_API_PROVIDER="Ethereum Beacon API spec example endpoint" python scripts/research/probe_beacon_consensus_source.py --artifact research-consensus-probe/eth-observation-capture.json --output research-consensus-probe/eth-consensus-source-spec-example.json
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("research-consensus-probe/eth-consensus-source-publicnode.json"),
              Path("research-consensus-probe/eth-consensus-source-spec-example.json"),
          ]
          results = [json.loads(p.read_text(encoding="utf-8")) for p in paths]
          for p in results:
              print("ETH_CONSENSUS_SOURCE_PROVIDER=" + str(p.get("provider")))
              print("ETH_CONSENSUS_SOURCE_BASE_URL=" + str(p.get("base_url")))
              print("ETH_CONSENSUS_SOURCE_STATUS=" + str(p.get("status")))
              print("ETH_CONSENSUS_SOURCE_FINALIZED=" + str(p.get("finalized_non_optimistic_probes")))
          print("ETH_CONSENSUS_COMPLETE_ACCOUNTING_VERIFIED=false")
          if not any(p.get("status") == "historical_partial_source_accessible" for p in results):
              print("::warning::No documented Beacon API candidate was confirmed; inspect both artifacts.")
          PY
      - name: Upload feasibility artifacts
        if: ${{ always() && hashFiles('research-consensus-probe/eth-observation-capture.json', 'research-consensus-probe/eth-consensus-source-probe.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eth-consensus-source-feasibility-${{ github.run_id }}
          path: |
            research-consensus-probe/eth-observation-capture.json
            research-consensus-probe/eth-consensus-source-probe.json
            research-consensus-probe/eth-consensus-source-publicnode.json
            research-consensus-probe/eth-consensus-source-spec-example.json
          if-no-files-found: warn
          retention-days: 7
