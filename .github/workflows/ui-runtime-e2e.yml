name: UI Runtime Contract E2E

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - 'workers/crypto-api/**'
      - '.github/workflows/ui-runtime-e2e.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build
      - name: Runtime UI contract E2E
        env:
          CRYPTO_API_URL: https://crypto-api.olegsh247.workers.dev
        run: |
          set -euo pipefail
          CRYPTO_API_URL="$CRYPTO_API_URL" npm run start -- -p 3000 > /tmp/crypto-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:3000/" >/tmp/ui-home.html
          curl -fsS "http://127.0.0.1:3000/assets/eth" >/tmp/ui-eth.html
          curl -fsS "http://127.0.0.1:3000/assets/eth/research" >/tmp/ui-eth-research.html
          curl -fsS "http://127.0.0.1:3000/assets/btc" >/tmp/ui-btc.html
          curl -fsS "http://127.0.0.1:3000/assets/btc/research" >/tmp/ui-btc-research.html

          # Product Contour v1: Home → Assets → Asset Dashboard → Deep Research.
          check() {
            local name="$1"
            local pattern="$2"
            local file="$3"
            if grep -Fq -- "$pattern" "$file"; then
              echo "UI_CHECK_OK $name"
            else
              echo "UI_CHECK_FAIL $name pattern=$pattern file=$file"
              echo "---- nearby HTML text ----"
              grep -F -C 2 -- "$pattern" "$file" || true
              exit 1
            fi
          }

          check "home_assets_anchor" 'href="#assets"' /tmp/ui-home.html
          check "home_research_link" 'href="/research"' /tmp/ui-home.html
          check "home_assets_label" '>Assets<' /tmp/ui-home.html
          check "eth_identity" 'ETH' /tmp/ui-eth.html
          check "eth_dashboard" 'ASSET DASHBOARD' /tmp/ui-eth.html
          check "eth_monitoring" 'Monitoring' /tmp/ui-eth.html
          check "eth_domains" 'Research Domains' /tmp/ui-eth.html
          check "eth_factors" 'Critical Factors' /tmp/ui-eth.html
          check "eth_scores" 'Research Scores' /tmp/ui-eth.html
          check "eth_scenarios" 'Scenarios' /tmp/ui-eth.html
          check "eth_current_price" 'Current price' /tmp/ui-eth.html
          check "eth_monitoring_dashboard" 'MONITORING DASHBOARD' /tmp/ui-eth.html
          check "eth_current_signals" 'CURRENT SIGNALS' /tmp/ui-eth.html
          check "eth_recent_events" 'RECENT EVENTS' /tmp/ui-eth.html
          check "eth_evidence" 'Evidence &amp; Sources' /tmp/ui-eth.html
          check "eth_evidence_chain" 'provenance layer' /tmp/ui-eth.html
          if grep -Fq -- '>Current<' /tmp/ui-eth.html || \
             grep -Fq -- '>Update recommended<' /tmp/ui-eth.html || \
             grep -Fq -- '>Outdated<' /tmp/ui-eth.html; then
            echo "UI_CHECK_OK eth_freshness"
          else
            echo "UI_CHECK_FAIL eth_freshness expected Current|Update recommended|Outdated file=/tmp/ui-eth.html"
            exit 1
          fi
          check "eth_deep_research_link" 'Open Deep Research' /tmp/ui-eth.html
          check "eth_research_chapters" 'Research chapters' /tmp/ui-eth-research.html
          check "eth_research_count" '15 chapters' /tmp/ui-eth-research.html
          check "eth_structure1" 'Structure 1' /tmp/ui-eth-research.html
          check "eth_chapter_01" 'Essence and current role' /tmp/ui-eth-research.html
          check "eth_chapter_02" 'Technology' /tmp/ui-eth-research.html
          check "eth_chapter_03" 'Tokenomics' /tmp/ui-eth-research.html
          check "eth_chapter_04" 'Network and on-chain state' /tmp/ui-eth-research.html
          check "eth_chapter_05" 'Ecosystem' /tmp/ui-eth-research.html
          check "eth_chapter_06" 'Users and activity' /tmp/ui-eth-research.html
          check "eth_chapter_07" 'Institutional use and capital' /tmp/ui-eth-research.html
          check "eth_chapter_08" 'Development and adoption' /tmp/ui-eth-research.html
          check "eth_chapter_09" 'Macroeconomic context' /tmp/ui-eth-research.html
          check "eth_chapter_10" 'Competitors and positioning' /tmp/ui-eth-research.html
          check "eth_chapter_11" 'Risks' /tmp/ui-eth-research.html
          check "eth_chapter_12" 'Catalysts' /tmp/ui-eth-research.html
          check "eth_chapter_13" 'Scenarios' /tmp/ui-eth-research.html
          check "eth_chapter_14" 'Conclusion' /tmp/ui-eth-research.html
          check "eth_chapter_15" 'Monitoring' /tmp/ui-eth-research.html
          check "btc_identity" 'BTC' /tmp/ui-btc.html
          check "btc_dashboard" 'ASSET DASHBOARD' /tmp/ui-btc.html
          check "btc_research_chapters" 'Research chapters' /tmp/ui-btc-research.html
          echo "UI_RUNTIME_E2E_OK contour=1 home=1 assets=1 eth=1 btc=1 dashboard=1 research=1 structure1=1"
