name: Temporary web lockfile generation

on:
  push:
    branches:
      - "fix/admin-session-csrf-hardening"
    paths:
      - "web/package.json"
      - ".github/workflows/temporary-web-lockfile.yml"
  pull_request:
    paths:
      - "web/package.json"
      - ".github/workflows/temporary-web-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean lockfile install
        run: npm ci --ignore-scripts
      - name: Commit generated lockfile to this PR branch
        working-directory: .
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build(web): add npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
