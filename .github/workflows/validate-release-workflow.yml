name: Validate VPS Release Workflow

on:
  pull_request:
    paths:
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/vps-api-build.yml"
      - ".github/workflows/validate-release-workflow.yml"
      - ".github/workflows/production-readonly-health.yml"
      - ".github/workflows/ui-runtime-e2e.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/vps-api-build.yml"
      - ".github/workflows/validate-release-workflow.yml"
      - ".github/workflows/production-readonly-health.yml"
      - ".github/workflows/ui-runtime-e2e.yml"

permissions:
  contents: read

jobs:
  actionlint:
    name: Static validation (no production access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Lint VPS release workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/release-gate.yml .github/workflows/vps-api-build.yml .github/workflows/validate-release-workflow.yml .github/workflows/production-readonly-health.yml .github/workflows/ui-runtime-e2e.yml
