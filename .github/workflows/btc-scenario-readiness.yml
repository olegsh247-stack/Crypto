name: BTC Scenario Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - "scripts/btc-scenario-readiness.mjs"
      - "scripts/btc-scenario-readiness.test.mjs"
      - "scripts/btc-scenario-direction.mjs"
      - "scripts/btc-scenario-direction.test.mjs"
      - "scripts/calculate-btc-review-scenario.mjs"
      - "scripts/calculate-btc-review-scenario.test.mjs"
      - "scripts/capture-btc-public-sources.mjs"
      - "scripts/run-btc-offline-scenario.mjs"
      - "fixtures/btc-offline-scenario-v1.json"
      - "scripts/run-btc-offline-scenario.mjs"
      - "fixtures/btc-offline-scenario-v1.json"
      - "scripts/prepare-btc-observation-candidates.mjs"
      - "scripts/prepare-btc-observation-candidates.test.mjs"
      - "scripts/validate-crypto-registries.mjs"
      - "infrastructure/postgres/seed-v1.sql"
      - "vps/shared/src/btc-scenario-readiness.ts"
      - "data/CryptoDataModel/registry/metric-registry.json"
      - "data/CryptoDataModel/registry/source-registry.json"
      - ".github/workflows/btc-scenario-readiness.yml"
      - "docs/BTC-SCENARIO-V1.md"
  pull_request:
    paths:
      - "scripts/btc-scenario-readiness.mjs"
      - "scripts/btc-scenario-readiness.test.mjs"
      - "scripts/btc-scenario-direction.mjs"
      - "scripts/btc-scenario-direction.test.mjs"
      - "scripts/calculate-btc-review-scenario.mjs"
      - "scripts/calculate-btc-review-scenario.test.mjs"
      - "scripts/capture-btc-public-sources.mjs"
      - "scripts/prepare-btc-observation-candidates.mjs"
      - "scripts/prepare-btc-observation-candidates.test.mjs"
      - "vps/shared/src/btc-scenario-readiness.ts"
      - "data/CryptoDataModel/registry/metric-registry.json"
      - "data/CryptoDataModel/registry/source-registry.json"
      - ".github/workflows/btc-scenario-readiness.yml"
      - "docs/BTC-SCENARIO-V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical shared readiness implementation
        working-directory: vps/shared
        run: npm install && npm run build
      - name: Test scenario input-quality and directional rules
        run: node scripts/validate-crypto-registries.mjs && node --test scripts/btc-scenario-readiness.test.mjs scripts/btc-scenario-direction.test.mjs scripts/prepare-btc-observation-candidates.test.mjs
      - name: Test review-only BTC calculation fails closed on missing inputs
        run: node --test scripts/calculate-btc-review-scenario.test.mjs
      - name: Run reproducible offline BTC scenario fixture
        run: node scripts/run-btc-offline-scenario.mjs
