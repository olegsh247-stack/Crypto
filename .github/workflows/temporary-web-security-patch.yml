name: Temporary Web Security Patch
on:
  push:
    branches:
      - fix/admin-session-csrf-hardening
    paths:
      - '.github/workflows/temporary-web-security-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-session-csrf-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Upgrade Next.js to patched 15.5.28
        run: |
          npm ci
          npm install next@15.5.28 --save-exact
          npm pkg set 'overrides.postcss=8.5.23'
          npm install
      - name: Confirm dependency audit is clean
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Commit package manifest and lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git diff --cached --quiet || git commit -m "fix(web): patch Next.js security advisories"
          git push origin HEAD:fix/admin-session-csrf-hardening
