name: Build Crypto Worker

on:
  pull_request:
    paths:
      - "workers/crypto-api/**"
      - "shared/**"
      - "wrangler.toml"
      - ".github/workflows/worker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: workers/crypto-api
        run: npm install --no-audit --no-fund
      - name: Build Worker without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/crypto-worker-build
