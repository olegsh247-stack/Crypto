name: VPS Docker image build

on:
  pull_request:
    paths:
      - "vps/**"
      - "web/**"
      - "shared/**"
      - ".github/workflows/vps-docker-image-build.yml"
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "web/**"
      - "shared/**"
      - ".github/workflows/vps-docker-image-build.yml"

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      ADMIN_TOKEN: ci-only-admin-token
      CORS_ORIGIN: http://localhost:3000
      CADDY_DOMAIN: localhost
      BACKUP_DIR_HOST: /tmp/crypto-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate and commit the Web dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix web
          sed -i 's#COPY web/package.json ./web/package.json#COPY web/package.json web/package-lock.json ./web/#; s/RUN cd web && npm install/RUN cd web && npm ci/' web/Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json web/Dockerfile
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Web dependencies for reproducible image"
            git push
          fi
      - name: Validate Compose configuration
        run: docker compose -f vps/docker-compose.production.yml config --quiet
      - name: Build Web, API and Worker images
        run: docker compose -f vps/docker-compose.production.yml build api worker web
