# Batch 4 runtime verification
name: Deploy Crypto API
# Batch 1+2 post-migration live verification

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Worker dependencies
        working-directory: workers/crypto-api
        run: npm install --no-audit --no-fund

      - name: Configure database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$NEON_DATABASE_URL"
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --name crypto-api

      - name: Configure admin secret when available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRYPTO_ADMIN_TOKEN: ${{ secrets.CRYPTO_ADMIN_TOKEN }}
        run: |
          if [ -n "$CRYPTO_ADMIN_TOKEN" ]; then
            printf '%s' "$CRYPTO_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --name crypto-api
          else
            echo "CRYPTO_ADMIN_TOKEN is not configured; protected admin/mutation endpoints will remain unavailable."
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: deploy

      - name: Enable stable workers.dev endpoint for live E2E
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/crypto-api/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"enabled":true}' | tee /tmp/worker-subdomain.json
          test "$(jq -r '.success' /tmp/worker-subdomain.json)" = "true"
          subdomain="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain')"
          test -n "$subdomain" && test "$subdomain" != "null"
          echo "CRYPTO_API_URL=https://crypto-api.$subdomain.workers.dev" >> "$GITHUB_ENV"

      - name: Live API E2E
        run: |
          set -euo pipefail
          node scripts/e2e-smoke.mjs

      - name: Diagnose live E2E endpoint on failure
        if: failure()
        run: |
          set +e
          echo "CRYPTO_API_URL=$CRYPTO_API_URL"
          curl -sS -D - "$CRYPTO_API_URL/api/health" -o /tmp/health.json
          cat /tmp/health.json || true

      - name: Install PostgreSQL client for DB verification
        run: |
          set -euo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y postgresql-client || test -x /usr/bin/psql
          command -v psql

      - name: Scheduled ingestion E2E and idempotency
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        working-directory: workers/crypto-api
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .dev.vars
          npx wrangler dev --test-scheduled --local --port 8787 > /tmp/crypto-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8787/api/health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:8787/api/health" >/dev/null
          curl -fsS "http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=30+0+*+*+*" >/tmp/ingest-run-1.json
          curl -fsS "http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=30+0+*+*+*" >/tmp/ingest-run-2.json
          actual_assets="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select string_agg(asset_id,' ' order by asset_id) from assets where enabled=true and asset_id <> 'usdt';" | xargs)"
          echo "INGESTION_REGISTRY actual_assets=$actual_assets"
          test "$actual_assets" = "bch btc cake dash eth ltc sol trx xrp"
          usdt_count="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from assets where asset_id='usdt' and symbol='USDT';" | tr -d '[:space:]')"
          echo "INGESTION_USDT count=$usdt_count"
          test "$usdt_count" = "1"
          pair_identity_errors="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_pairs mp join assets ba on ba.asset_id=mp.base_asset_id join assets qa on qa.asset_id=mp.quote_asset_id where upper(split_part(mp.symbol,'/',1)) <> upper(ba.symbol) or upper(split_part(mp.symbol,'/',2)) <> upper(qa.symbol);" | tr -d '[:space:]')"
          echo "INGESTION_PAIR_IDENTITY errors=$pair_identity_errors"
          test "$pair_identity_errors" = "0"
          for asset in btc dash eth sol cake bch ltc xrp trx; do
            count="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles where asset_id='$asset';" | tr -d '[:space:]')"
            fresh="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles where asset_id='$asset' and candle_open_at >= current_date - interval '2 days';" | tr -d '[:space:]')"
            echo "INGESTION_ASSET asset=$asset total=$count fresh_2d=$fresh"
            test "$fresh" -ge 1
          done
          duplicate_keys="$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from (select asset_id,candle_open_at,count(*) from market_daily_candles group by asset_id,candle_open_at having count(*) > 1) d;" | tr -d '[:space:]')"
          echo "INGESTION_DUPLICATES count=$duplicate_keys"
          test "$duplicate_keys" = "0"
          echo "INGESTION_E2E_OK assets=9 exact_registry=1 usdt=1 pair_identity=1 fresh_2d=1 runs=2 duplicate_keys=0"

      - name: Verify deployed Engine contract directly in Neon
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select 1" | grep -qx '1'
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from information_schema.tables where table_schema='public' and table_name in ('assets','asset_types','research_snapshots','research_blocks','research_domains','research_block_domains','critical_factors','research_scores','research_scenarios','monitoring_signals','research_status','market_pairs');" | grep -qx '12'
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from pg_constraint where conrelid='market_pairs'::regclass and conname='market_pairs_exchange_symbol_unique';" | grep -qx '1'
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from information_schema.columns where table_schema='public' and table_name='market_pairs' and column_name in ('symbol','base_asset_id','quote_asset_id','exchange','enabled');" | grep -qx '5'
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from assets where asset_id='eth' and symbol='ETH' and primary_asset_type_id='l1_settlement_asset';" | grep -qx '1'
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from assets where asset_id='ETH';" | grep -qx '0'
          echo "ENGINE_CONTRACT_OK required_engine_tables=12 market_pairs_columns=5 canonical_eth=1 uppercase_eth=0"
