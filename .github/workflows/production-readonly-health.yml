name: Crypto Production Read-only Health

# Read-only smoke check only. This workflow never deploys, migrates, or ingests data.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-readonly-health.yml"
      - "scripts/production-readonly-health.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-production-readonly-health
  cancel-in-progress: true

jobs:
  health:
    name: Public API and database health (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live API read-only
        env:
          CRYPTO_API_URL: https://crypto-api.olegsh247.workers.dev
        run: node scripts/production-readonly-health.mjs
