name: Web E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/e2e-smoke.mjs"
      - ".github/workflows/web-e2e.yml"

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run live Crypto API E2E
        env:
          CRYPTO_API_URL: ${{ secrets.CRYPTO_API_URL }}
        run: node scripts/e2e-smoke.mjs
