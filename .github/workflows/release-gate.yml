name: Crypto VPS Release Gate

# This gate is safe before a VPS is purchased: it builds and tests the target
# stack only. It does not deploy, mutate production data, or use production secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "shared/**"
      - "web/**"
      - "infrastructure/**"
      - "scripts/migrate-postgres.sh"
      - "scripts/backup-postgres.sh"
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/vps-api-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vps-api:
    name: VPS API, worker, PostgreSQL, backup and E2E
    uses: ./.github/workflows/vps-api-build.yml

  web:
    name: Web build
    needs: vps-api
    uses: ./.github/workflows/web-build.yml
