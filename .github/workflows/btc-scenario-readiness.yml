name: BTC Scenario Readiness Gate

on:
  pull_request:
    paths:
      - "scripts/btc-scenario-readiness.mjs"
      - "scripts/btc-scenario-readiness.test.mjs"
      - "scripts/btc-scenario-direction.mjs"
      - "scripts/btc-scenario-direction.test.mjs"
      - "scripts/validate-source-metric-registries.mjs"
      - "scripts/validate-source-metric-registries.test.mjs"
      - "scripts/btc-candidate-staging.test.mjs"
      - "scripts/normalize-btc-candidate-manifest.mjs"
      - "scripts/normalize-btc-candidate-manifest.test.mjs"
      - "scripts/btc-source-contracts.mjs"
      - "scripts/btc-source-contracts.test.mjs"
      - "docs/data-review/BTC-CANDIDATE-STAGING-DRY-RUN-2026-10-13.json"
      - "vps/shared/src/btc-scenario-readiness.ts"
      - "data/CryptoDataModel/registry/metric-registry.json"
      - "data/CryptoDataModel/registry/source-registry.json"
      - ".github/workflows/btc-scenario-readiness.yml"
      - "docs/BTC-SCENARIO-V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical shared readiness implementation
        working-directory: vps/shared
        run: npm install && npm run build
      - name: Validate shared source and metric registries
        run: node scripts/validate-source-metric-registries.mjs
      - name: Test scenario input-quality, directional rules, and registry contracts
        run: node --test scripts/btc-scenario-readiness.test.mjs scripts/btc-scenario-direction.test.mjs scripts/validate-source-metric-registries.test.mjs scripts/btc-candidate-staging.test.mjs scripts/normalize-btc-candidate-manifest.test.mjs scripts/btc-source-contracts.test.mjs
