name: Build Crypto Web

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build
      - name: Runtime UI contract E2E
        env:
          CRYPTO_API_URL: https://crypto-api.olegsh247.workers.dev
        run: |
          set -euo pipefail
          CRYPTO_API_URL="$CRYPTO_API_URL" npm run start -- -p 3000 > /tmp/crypto-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:3000/" >/tmp/ui-home.html
          curl -fsS "http://127.0.0.1:3000/pairs" >/tmp/ui-pairs.html
          curl -fsS "http://127.0.0.1:3000/assets/eth" >/tmp/ui-eth.html
          curl -fsS "http://127.0.0.1:3000/assets/eth/research" >/tmp/ui-research.html
          assert_contains() {
            local file="$1"
            local pattern="$2"
            local label="$3"
            if ! grep -q "$pattern" "$file"; then
              echo "UI_RUNTIME_E2E_FAIL label=$label pattern=$pattern file=$file"
              echo "--- file relevant text ---"
              sed 's/<[^>]*>/ /g' "$file" | tr -s ' ' | head -c 4000 || true
              echo
              echo "--- next server log ---"
              tail -n 120 /tmp/crypto-web.log || true
              exit 1
            fi
          }
          assert_contains /tmp/ui-home.html '/pairs/' 'home_pairs_link'
          assert_contains /tmp/ui-pairs.html '/pairs/' 'pairs_canonical_link'
          assert_contains /tmp/ui-eth.html 'ETH' 'eth_identity'
          assert_contains /tmp/ui-eth.html 'Monitoring' 'eth_monitoring'
          assert_contains /tmp/ui-eth.html 'Freshness:' 'eth_freshness'
          assert_contains /tmp/ui-eth.html '15 blocks' 'eth_research_blocks'
          assert_contains /tmp/ui-research.html 'Research chapters' 'deep_research_chapters'
          echo "UI_RUNTIME_E2E_OK home=1 pairs=1 eth=1 lifecycle=1 freshness=1 research=1"
