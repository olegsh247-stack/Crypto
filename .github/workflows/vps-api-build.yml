name: VPS API Build Rehearsal

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify repository is VPS-only
        run: node scripts/check-vps-only-repository.mjs
      - name: Build VPS shared runtime
        working-directory: vps/shared
        run: npm install && npm run build
      - name: Install VPS API dependencies
        working-directory: vps/api
        run: npm install
      - name: Build VPS worker
        working-directory: vps/worker
        run: npm install && npm run build
      - name: Build VPS API
        working-directory: vps/api
        run: npm run build
      - name: Validate production Compose network boundaries
        run: |
          set -euo pipefail
          docker compose --profile ops --env-file vps/.env.production.example -f vps/docker-compose.production.yml config --format json > /tmp/crypto-production-compose.json
          python3 - <<'PY'
          import json
          config=json.load(open('/tmp/crypto-production-compose.json'))
          services=config['services']
          assert not services['postgres'].get('ports'), services['postgres'].get('ports')
          assert not services['api'].get('ports'), services['api'].get('ports')
          assert not services['worker'].get('ports'), services['worker'].get('ports')
          assert not services['backup'].get('ports'), services['backup'].get('ports')
          assert 'ops' in services['backup'].get('profiles',[]), services['backup'].get('profiles')
          caddy_ports={str(p['published']) for p in services['caddy'].get('ports',[])}
          assert {'80','443'} <= caddy_ports, caddy_ports
          assert services['worker']['environment']['WORKER_SCHEDULE_UTC']=='00:30'
          print('VPS_PRODUCTION_COMPOSE_OK public_ports=80,443 postgres_private=1 api_private=1 worker_private=1')
          PY
      - name: Start PostgreSQL rehearsal
        id: postgres
        run: |
          set -euo pipefail
          docker run -d --name crypto-vps-postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=crypto_test -p 127.0.0.1::5432 postgres:16
          port="$(docker port crypto-vps-postgres 5432/tcp | awk -F: '{print $NF}')"
          test -n "$port"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p "$port" -U postgres -d crypto_test >/dev/null 2>&1 && break
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p "$port" -U postgres -d crypto_test
      - name: Bootstrap PostgreSQL with repository migrations
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test'
          bash scripts/migrate-postgres.sh
          bash scripts/migrate-postgres.sh
          count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from schema_migrations;")
          duplicates=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from (select version from schema_migrations group by version having count(*) > 1) d;")
          test "$count" -gt 0
          test "$duplicates" = "0"
          echo "VPS_DB_BOOTSTRAP_OK migrations=$count duplicate_markers=0 rerun=1"
      - name: Verify canonical BTC input registry
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test
        run: |
          set -euo pipefail
          for spec in \
            'market.spot_price|USD/BTC' \
            'security.hashrate|EH/s' \
            'security.fee_subsidy_ratio|ratio' \
            'macro.dxy|index' \
            'institutional.etf_net_flow|USD million/day'; do
            metric="${spec%%|*}"
            unit="${spec#*|}"
            count=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -c "SELECT count(*) FROM metric_definitions WHERE metric_id='$metric' AND default_unit='$unit' AND value_type='numeric'")
            test "$count" = "1"
          done
          for source in market_binance network.primary institutional.primary; do
            count=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -c "SELECT count(*) FROM sources WHERE source_id='$source'")
            test "$count" = "1"
          done
      - name: BTC input provenance audit (read-only)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/audit-btc-input-provenance.sql
      - name: BTC observation idempotency and duplicate reconciliation rehearsal
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test
        run: |
          set -euo pipefail
          chmod +x scripts/reconcile-btc-exact-duplicates-target.sh scripts/test-btc-observation-idempotency.sh
          ./scripts/test-btc-observation-idempotency.sh
      - name: PostgreSQL backup and restore rehearsal
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test
          BACKUP_DIR: /tmp/crypto-postgres-backup-e2e
          BACKUP_RETENTION_DAYS: "14"
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          bash scripts/backup-postgres.sh
          dump=$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'crypto-postgres-*.dump' -print -quit)
          test -n "$dump"
          sha256sum -c "$dump.sha256"
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="CREATE DATABASE crypto_restore_test;"
          restore_url='postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_restore_test'
          pg_restore --exit-on-error --no-owner --no-acl --dbname="$restore_url" "$dump"
          table_counts() {
            local url="$1"
            psql "$url" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "
              SELECT format(
                'SELECT %L AS table_name, count(*)::bigint AS row_count FROM %I.%I;',
                table_schema || '.' || table_name, table_schema, table_name
              )
              FROM information_schema.tables
              WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
              ORDER BY table_name
            " | psql "$url" -X -A -t -F '|' -v ON_ERROR_STOP=1
          }
          table_counts "$DATABASE_URL" | sort > /tmp/source-table-counts.txt
          table_counts "$restore_url" | sort > /tmp/restore-table-counts.txt
          diff -u /tmp/source-table-counts.txt /tmp/restore-table-counts.txt
          echo "POSTGRES_BACKUP_RESTORE_OK checksum=1 public_table_counts_match=1"
      - name: Start VPS API
        working-directory: vps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test
          ADMIN_TOKEN: local-development-only
          CORS_ORIGIN: http://localhost:3000
          PORT: 8080
          HOST: 127.0.0.1
        run: |
          nohup node dist/server.js > /tmp/crypto-vps-api.log 2>&1 &
          echo $! > /tmp/crypto-vps-api.pid
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health | tee /tmp/health.json
          curl -fsS http://127.0.0.1:8080/api/db-health | tee /tmp/db-health.json
      - name: VPS API contract E2E
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/assets > /tmp/assets.json
          curl -fsS http://127.0.0.1:8080/api/pairs > /tmp/pairs.json
          python3 - <<'PY'
          import json
          assets=json.load(open('/tmp/assets.json'))
          pairs=json.load(open('/tmp/pairs.json'))
          items=assets.get('assets',assets.get('items',assets if isinstance(assets,list) else []))
          pitems=pairs.get('items',pairs.get('pairs',[]))
          assert len(items)==10, f"assets={len(items)}"  # includes USDT quote asset
          assert len(pitems)==9, f"pairs={len(pitems)}"
          assert all(p.get('enabled') is True for p in pitems)
          print(f"VPS_API_REGISTRY_OK assets={len(items)} pairs={len(pitems)}")
          PY
          curl -fsS http://127.0.0.1:8080/api/assets/eth > /tmp/eth.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/eth.json'))
          asset=d.get('asset',d)
          assert asset.get('asset_id')=='eth', asset
          assert asset.get('research_status') in ('current','outdated','in_progress','complete','monitoring','not_started'), asset
          assert asset.get('research_freshness',{}).get('status') in ('current','update_recommended','outdated'), asset
          print("VPS_API_ETH_OK lifecycle=1 freshness=1")
          PY
      - name: VPS mutation contract E2E
        run: |
          set -euo pipefail
          auth=(-H 'Authorization: Bearer local-development-only' -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/asset-mutation.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/assets -d '{"symbol":"VPSQA","name":"VPS QA Asset","enabled":false}')
          test "$code" = "201"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/asset-mutation.json'))
          assert d.get('status')=='ok'
          assert d['item']['asset_id']=='vpsqa'
          PY
          asset_id=vpsqa
          code=$(curl -sS -o /tmp/asset-delete.json -w '%{http_code}' "${auth[@]}" -X DELETE "http://127.0.0.1:8080/api/assets/$asset_id")
          test "$code" = "200"
          code=$(curl -sS -o /tmp/pair-mutation.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/pairs -d '{"symbol":"BTC/USDT","exchange":"binance"}')
          test "$code" = "201"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pair-mutation.json'))
          assert d.get('status')=='ok'
          assert d['item']['symbol']=='BTC/USDT'
          assert d['item']['exchange']=='binance'
          assert d['item']['enabled'] is True
          PY
          code=$(curl -sS -o /tmp/commodity-mutation.json -w '%{http_code}' "${auth[@]}" -X POST http://127.0.0.1:8080/api/commodities -d '{"symbol":"VPSQA","name":"VPS QA Commodity","unit":"unit"}')
          test "$code" = "201"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/commodity-mutation.json'))
          assert d.get('status')=='ok'
          assert d['item']['symbol']=='VPSQA'
          PY
          commodity_id=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/commodity-mutation.json'))['item']['id'])
          PY
          )
          code=$(curl -sS -o /tmp/commodity-delete.json -w '%{http_code}' "${auth[@]}" -X DELETE "http://127.0.0.1:8080/api/commodities/$commodity_id")
          test "$code" = "200"
          echo "VPS_API_MUTATIONS_OK asset_create_delete=1 pair_upsert=1 commodity_create_delete=1"
      - name: VPS worker ingestion E2E
        working-directory: vps/worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ steps.postgres.outputs.port }}/crypto_test
          WORKER_RUN_ONCE: "1"
        run: |
          set -euo pipefail
          before=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles;")
          monitoring_before=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select coalesce(max(last_updated_at), 'epoch'::timestamptz) from monitoring_signals where status <> 'disabled';")
          node dist/index.js | tee /tmp/crypto-vps-worker-1.log
          after=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles;")
          result=$(grep -F '{"status":"ok","service":"crypto-worker-vps"' /tmp/crypto-vps-worker-1.log | tail -1)
          test -n "$result"
          successful=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["successful"])' "$result")
          written=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["written"])' "$result")
          test "$successful" = "9"
          test "$written" -gt 0
          echo "VPS_WORKER_CANDLE_COUNT before=$before after=$after (UPSERT may update existing rows)"
          test "$after" -ge "$before"
          actual_asset_count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from assets where enabled=true and asset_id <> 'usdt';" | tr -d '[:space:]')
          actual_assets=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select string_agg(asset_id,' ' order by asset_id) from assets where enabled=true and asset_id <> 'usdt';" | xargs)
          echo "VPS_WORKER_REGISTRY enabled_non_quote_assets=$actual_asset_count ids=$actual_assets"
          test "$actual_asset_count" = "9"
          for asset in btc dash eth sol cake bch ltc xrp trx; do
            total=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles where asset_id='$asset';" | tr -d '[:space:]')
            fresh=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from market_daily_candles where asset_id='$asset' and candle_open_at >= current_date - interval '2 days';" | tr -d '[:space:]')
            echo "VPS_WORKER_ASSET asset=$asset total=$total fresh_2d=$fresh"
            test "$fresh" -ge 1
          done
          node dist/index.js | tee /tmp/crypto-vps-worker-2.log
          duplicates=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from (select asset_id,candle_open_at from market_daily_candles group by asset_id,candle_open_at having count(*) > 1) d;")
          test "$duplicates" = "0"
          monitoring_after=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select coalesce(max(last_updated_at), 'epoch'::timestamptz) from monitoring_signals where status <> 'disabled';")
          monitoring_count=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from monitoring_signals where status <> 'disabled';")
          if [ "$monitoring_count" -gt 0 ]; then
            test "$monitoring_after" = "$monitoring_before"
          fi
          monitoring_refresh=0
          echo "VPS_WORKER_E2E_OK successful=$successful written=$written assets=9 exact_registry=1 fresh_2d=1 runs=2 duplicate_keys=$duplicates monitoring_refresh=$monitoring_refresh"
      - name: VPS API offline contract invariants
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; print("VPS_API_HEALTH_OK")'
          curl -fsS http://127.0.0.1:8080/api/db-health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; print("VPS_API_DB_HEALTH_OK")'
          curl -fsS http://127.0.0.1:8080/api/assets/btc | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d.get("asset",d); assert a.get("asset_id") == "btc", a; assert isinstance(d.get("research_blocks",[]), list), d; print("VPS_API_BTC_CONTRACT_OK")'
          curl -fsS 'http://127.0.0.1:8080/api/pairs/ETH%2FUSDT/history?days=7&interval=1d' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert isinstance(d.get("rows"), list), d; print("VPS_API_HISTORY_CONTRACT_OK")'

      - name: VPS BTC research evidence and snapshot lineage E2E
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/assets/btc > /tmp/btc-research.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/btc-research.json'))
          snapshot=d.get('research_snapshot') or {}
          sid=snapshot.get('snapshot_id')
          assert sid == 'BTC-2026-10-07-v1', snapshot
          assert snapshot.get('status') == 'PUBLISHED', snapshot
          evidence=d.get('evidence')
          assert isinstance(evidence,list) and len(evidence) >= 15, f'evidence={evidence}'
          assert all(e.get('snapshot_id') == sid for e in evidence), 'cross-snapshot evidence'
          assert all(e.get('claim') and e.get('source_id') and e.get('source_url') and e.get('observation_id') and e.get('metric_id') and e.get('block_number') and (e.get('observation_value') is not None or e.get('data_summary') is not None) for e in evidence), 'evidence provenance/value incomplete'
          assert len({e['block_number'] for e in evidence}) == 15, 'evidence does not cover all 15 blocks'
          readiness=d.get('scenario_readiness') or {}
          assert readiness.get('status') == 'not_evaluable', f"unexpected readiness={readiness}"
          assert readiness.get('can_persist_scenario_state') is False, 'input gate must never authorize persistence'
          blockers=readiness.get('blockers',[])
          assert any(x.get('metric_id') == 'security.fee_subsidy_ratio' and x.get('reason') == 'missing' for x in blockers), 'missing fee/subsidy metric must block readiness'
          assert any(x.get('metric_id') == 'macro.dxy' and x.get('reason') == 'missing' for x in blockers), 'missing DXY metric must block readiness'
          assert any(x.get('metric_id') == 'institutional.etf_net_flow' and x.get('reason') == 'latest_observation_must_be_current_traceable_and_within_36_hours' for x in blockers), 'stale latest ETF flow must block readiness'
          assert len(d.get('critical_factors',[])) == 6, 'BTC current snapshot factors'
          assert all(f.get('snapshot_id') == sid for f in d.get('critical_factors',[])), 'cross-snapshot factor'
          assert len(d.get('scores',[])) == 5, 'BTC current snapshot scores'
          assert all(s.get('snapshot_id') == sid for s in d.get('scores',[])), 'cross-snapshot score'
          scenarios=d.get('research_scenarios',[])
          assert {s.get('scenario_type') for s in scenarios} == {'bull','base','bear'}, 'scenario set incomplete'
          assert round(sum(float(s.get('probability',0)) for s in scenarios), 6) == 1, 'scenario probabilities do not sum to 1'
          assert all(s.get('snapshot_id') == sid for s in scenarios), 'cross-snapshot scenario'
          states=d.get('scenario_states',[])
          assert all(s.get('snapshot_id') == sid for s in states), 'cross-snapshot scenario state'
          assert states == [], 'clean baseline must not fabricate a scenario-state evaluation'
          events=d.get('monitoring_events',[])
          assert events == [], 'clean baseline must not fabricate monitoring events'
          signals=d.get('monitoring_signals',[])
          assert len(signals) == 7, f'baseline monitoring signals={len(signals)}'
          assert all(isinstance(x.get('current_value'),dict) and x['current_value'].get('description') for x in signals), 'baseline signals must remain explicitly descriptive, not fake live measurements'
          print(f'VPS_BTC_RESEARCH_CHAIN_OK snapshot={sid} evidence={len(evidence)} blocks={len(set(e["block_number"] for e in evidence))} factors=6 scores=5 scenarios=3')
          PY
      - name: VPS API persisted history and candle finalization E2E
        run: |
          set -euo pipefail
          curl -fsS -o /tmp/history.json -w '%{http_code}' 'http://127.0.0.1:8080/api/pairs/ETH%2FUSDT/history?days=7&interval=1d' | grep -qx '200'
          curl -fsS -o /tmp/eth.json http://127.0.0.1:8080/api/assets/eth
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          history=json.load(open('/tmp/history.json'))
          asset=json.load(open('/tmp/eth.json'))
          assert history.get('status')=='ok', history
          rows=history.get('rows',[])
          assert rows, history
          candles=asset.get('history',[])
          assert candles, asset
          now=datetime.now(timezone.utc)
          finalized_times=set()
          for candle in candles:
              close_at=datetime.fromisoformat(candle['candle_close_at'].replace('Z','+00:00'))
              expected=close_at <= now
              assert candle.get('is_finalized') is expected, candle
              if expected:
                  finalized_times.add(datetime.fromisoformat(candle['candle_open_at'].replace('Z','+00:00')).isoformat())
          assert finalized_times, candles
          for row in rows:
              row_time=datetime.fromisoformat(row['time'].replace('Z','+00:00')).isoformat()
              assert row_time in finalized_times, row
          print(f"VPS_API_HISTORY_OK rows={len(rows)} candles={len(candles)} finalized={len(finalized_times)} in_progress={sum(1 for c in candles if c.get('is_finalized') is False)}")
          PY
      - name: VPS admin boundary E2E
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' http://127.0.0.1:8080/api/admin/db-schema)
          test "$code" = "401"
          code=$(curl -sS -o /tmp/admin-ok.json -w '%{http_code}' -H 'Authorization: Bearer local-development-only' http://127.0.0.1:8080/api/admin/db-schema)
          test "$code" = "200"
          echo "VPS_API_ADMIN_OK unauthorized=401 authorized=200"
      - name: Cleanup PostgreSQL rehearsal
        if: always()
        run: docker rm -f crypto-vps-postgres >/dev/null 2>&1 || true
